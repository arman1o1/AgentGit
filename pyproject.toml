[project]
name = "agentgit"
version = "1.0.0"
description = "Container Filesystem + PagedAttention Radix KV-Cache Time-Travel Debugger for Autonomous Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
llm = [
    "tiktoken>=0.7.0",
    "torch>=2.1.0",
    "transformers>=4.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
